<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Responsive Image Gallery</title>
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <!-- Header Section -->
    <header class="gallery-header">
        <h1>Developer Photo Gallery</h1>
        <p>An auto-responsive image grid powered by CSS Grid `auto-fit` and `minmax()`.</p>
    </header>

    <!-- 1 & 2. Gallery Container & 8 Items -->
    <main class="gallery-container">
        <div class="gallery-grid">
            
            <!-- Item 1 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" alt="Workspace setup with laptop and code" class="gallery-img">
                <div class="gallery-caption"><h3>Workspace Setup</h3></div>
            </article>

            <!-- Item 2 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80" alt="Code editor on screen" class="gallery-img">
                <div class="gallery-caption"><h3>Clean Code</h3></div>
            </article>

            <!-- Item 3 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" alt="Laptop displaying web development" class="gallery-img">
                <div class="gallery-caption"><h3>Web Development</h3></div>
            </article>

            <!-- Item 4 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80" alt="Team collaborating on code" class="gallery-img">
                <div class="gallery-caption"><h3>Team Collaboration</h3></div>
            </article>

            <!-- Item 5 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=600&q=80" alt="Person typing on mechanical keyboard" class="gallery-img">
                <div class="gallery-caption"><h3>Mechanical Keyboard</h3></div>
            </article>

            <!-- Item 6 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=600&q=80" alt="Group brainstorming session" class="gallery-img">
                <div class="gallery-caption"><h3>Brainstorming</h3></div>
            </article>

            <!-- Item 7 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=600&q=80" alt="Coding monitor setup" class="gallery-img">
                <div class="gallery-caption"><h3>Dual Monitors</h3></div>
            </article>

            <!-- Item 8 -->
            <article class="gallery-item">
                <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80" alt="Matrix binary code background" class="gallery-img">
                <div class="gallery-caption"><h3>Matrix Architecture</h3></div>
            </article>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Auto-Responsive Gallery Assignment</p>
    </footer>

</body>
</html>
